name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Its base_url output comes from the Pages API, so it reflects a custom
      # domain; GITHUB_REPOSITORY_OWNER can only ever reconstruct the default
      # github.io host, which is wrong the moment a CNAME is in play. Note a
      # custom domain on the *user* site (owner.github.io) also rebases every
      # project site under it, even when the project repo has no CNAME.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # One build for every environment (home + each lab directory) into
      # _site/: bundles, config.js, URL templating, cache-busting, source
      # maps, and validation. See scripts/build.js — the same command runs
      # locally, so there's no CI-only build logic to drift from.
      - name: Build all environments
        env:
          DD_APP_ID: ${{ secrets.DD_APP_ID }}
          DD_CLIENT_TOKEN: ${{ secrets.DD_CLIENT_TOKEN }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Upload source maps to Datadog
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run sourcemaps:upload

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
