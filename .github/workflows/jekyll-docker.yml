name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Two jobs so pull requests get a real build check: the github-pages
# environment only accepts deploys from main, and a job that names it is
# rejected outright on a PR — before a single step runs. `build` never
# touches that environment, so it runs everywhere; only `deploy` does.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's base_url
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Its base_url output comes from the Pages API, so it reflects a custom
      # domain; GITHUB_REPOSITORY_OWNER can only ever reconstruct the default
      # github.io host, which is wrong the moment a CNAME is in play. Note a
      # custom domain on the *user* site (owner.github.io) also rebases every
      # project site under it, even when the project repo has no CNAME.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # One build for every environment (home + each lab directory) into
      # _site/: bundles, config.js, URL templating, cache-busting, source
      # maps, and validation. See scripts/build.js — the same command runs
      # locally, so there's no CI-only build logic to drift from.
      - name: Build all environments
        env:
          DD_APP_ID: ${{ secrets.DD_APP_ID }}
          DD_CLIENT_TOKEN: ${{ secrets.DD_CLIENT_TOKEN }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      # Main only: PR builds stamp a version that never reaches production,
      # so their maps would just be noise in Datadog.
      - name: Upload source maps to Datadog
        if: github.event_name == 'push'
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run sourcemaps:upload

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Scoped to this job, not the workflow, so a PR build never queues
    # behind an in-flight deploy.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
