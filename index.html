<!-- The pizza builder used to live here, at /. It moved to
     pizza-builder-lab/, so forward what used to reach it before anything else
     loads:
       - old wizard links (/#crust … /#results), hash kept
       - the scheduled Browser Synthetic test, which runs the wizard from /
         and drives an SLO: its user agent (or ?synthetic / force_session_type,
         the pizza builder's own test switches) goes straight to the wizard,
         query string kept.
     location.replace, so the redirect doesn't add a history entry. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var oldStep = /^#(crust|sauce|cheese|toppings|size|results)$/.test(location.hash);
    var synthetic = /DatadogSynthetics/i.test(navigator.userAgent) || q.has('synthetic') || q.has('force_session_type');
    if (oldStep || synthetic) location.replace('pizza-builder-lab/' + location.search + location.hash);
  })();
</script>
<script>
  (function(h,o,u,n,d) {
    h=h[d]=h[d]||{q:[],onReady:function(c){h.q.push(c)}}
    d=o.createElement(u);d.async=1;d.src=n;d.crossOrigin=''
    n=o.getElementsByTagName(u)[0];n.parentNode.insertBefore(d,n)
  })(window,document,'script','https://www.datadoghq-browser-agent.com/us1/v6/datadog-rum.js','DD_RUM')
</script>

<script>
  // Resolve and apply the theme before first paint to avoid a flash.
  // One saved value drives both switches DRUIDS and our own code read:
  //   class="theme-dark theme-dark-hc"  — DRUIDS tokens (none = light)
  //   data-theme="light|dark"           — anything that reads the attribute
  // Kept inline and duplicated per page on purpose: it has to run before the
  // first paint, which rules out lab-shared.js at the end of <body>.
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark'
                     : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (dark) root.classList.add('theme-dark', 'theme-dark-hc');
  })();
</script>
